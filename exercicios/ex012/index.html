    <h1>Inserindo vídeos hospedados localmente</h1>
    <p>Este vídeo está hospedado no meu próprio servidor.</p>
    <video controls width="500" poster="midia/The_Last_of_Us_capa.png" controls autoplay loop >
        <source src="midia/the-last-of-us-hdr-4k-live.mp4" type="video/mp4">
        <!-- coloque ontros formatos do mesmo video-->
         <p>Seu navegador não tem compatibilidade com reprodução de vídeos.</p>
    </video>
    <!-- essa forma de colocar video no saite e muito pessado, custa muito manter-->

    <h1>Inserindo vídeos do YouTube</h1>
