<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagem dinamica</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplismente aumente o tamanho do seu navegador.</p>
    <picture>
        <!--em (min-width:) mude para (max-width) coloque o tamanho da imagen 50 px a mais-->
        <source media="(max-width: 750px)" srcset="imagens/imagen-p.png" type="image/png">
        <!--é necessário digitar o endereço da imagen em (srcset" ")-->
        <source media="(max-width: 1050px)" srcset="imagens/imagen-m.png" type="image/png">
        <img src="imagens/imagen-g.png" alt="imagen flexivel G">
        <!--comece com a imagen maior-->
    </picture>

    <h1>Reproduzindo Áudio</h1>
    <p>Vamos aprender a reproduzir áudios em HTML.</p>
    <!-- apague o comoplemento que vem na tag auldio e coloque (preload="metadata" autoplay controls)-->
    <audio preload="metadata" autoplay controls>
        <source src="midias/1975 - Josh Kirsch_Media Right Productions.mp3" type="audio/mpeg">
        <p>Infelizmente seu navegador não consegue reproduzir áudio.</p><!-- apenas caso o navegaror não reproduzir-->
        <a href="midias/1975 - Josh Kirsch_Media Right Productions.mp3">Clique aqui para baixar o arquivo MP3</a>
    </audio>
</body>
</html>
